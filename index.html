<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SKS 학습 시스템</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // 앱에서 저장한 테마 설정을 그대로 이어받는다 (깜빡임 방지를 위해 렌더 전에 실행).
  try {
    const saved = JSON.parse(localStorage.getItem('ctb_theme_v1') || '"light"');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) { /* localStorage 접근 불가 시 기본 라이트 테마 유지 */ }
</script>
</head>
<body class="landing-body">

  <div class="landing-inner">
    <div class="brand-mark zh landing-brand-mark">汉</div>
    <h1 class="landing-title">SKS 학습 시스템</h1>
    <p class="landing-sub">상해한국학교 중국어 학습 플랫폼</p>

    <div class="landing-cards">
      <a class="landing-card" href="textbook.html">
        <div class="landing-card-icon zh">教</div>
        <p class="landing-card-title">중국어 교재</p>
        <p class="landing-card-desc">단원별 본문·단어·문법·연습문제를 학습하는<br>온라인 교재</p>
      </a>
      <a class="landing-card" href="hsk-reading.html">
        <div class="landing-card-icon">HSK</div>
        <p class="landing-card-title">HSK 독해</p>
        <p class="landing-card-desc">HSK 5급 독해 문제 풀이 연습</p>
      </a>
    </div>

    <div id="landing-announcements" class="landing-announcements"></div>
  </div>

  <script src="js/landing.js"></script>
</body>
</html>
